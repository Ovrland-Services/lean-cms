pt-BR:
  # Month/day names needed by I18n.l. Lean CMS ships these in-gem (instead of
  # depending on rails-i18n) so hosts that don't already configure a pt-BR
  # locale get correct date rendering out of the box. Hosts already using
  # rails-i18n can shadow these keys freely — their locale files win.
  date:
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    formats:
      lean_cms_date: "%-d de %B de %Y"

  lean_cms:
    statuses:
      published: Publicado
      draft: Rascunho
      new_submission: Novo envio
      read: Lido
      replied: Respondido
      archived: Arquivado

    dashboard:
      index:
        title: Painel

        stats:
          published_posts: Posts publicados
          draft_posts: Rascunhos
          unread_messages: Mensagens não lidas
          page_sections: Seções de página

        recent_posts:
          title: Posts recentes
          view_all: Ver todos
          by: "%{datetime} por %{author}"
          empty: Nenhum post ainda
          create_first: Crie seu primeiro post

        recent_submissions:
          title: Envios recentes
          view_all: Ver todos
          empty: Nenhum envio ainda

        quick_actions:
          title: Ações rápidas
          create_post:
            label: Criar post
            description: Novo post de blog ou item de portfólio
          edit_pages:
            label: Editar páginas
            description: Atualize o conteúdo das páginas
          view_site:
            label: Ver site
            description: Veja seu site no ar

    content_lock:
      banner:
        locked: A edição de conteúdo está bloqueada.
        locked_ago: "Bloqueada há %{time}."
        unlock: Desbloquear

    shared:
      sidebar:
        dashboard: Painel
        content: Conteúdo
        posts: Blog e portfólio
        page_contents: Conteúdo das páginas
        form_submissions: Envios de formulário
        administration: Administração
        users: Usuários
        notification_settings: Notificações
        activity: Registro de atividades

      header:
        default_title: Painel
        new_post: Novo post
        docs: Documentação do Lean CMS
        help: Ajuda
        view_site: Ver site
        settings: Configurações
        sign_out: Sair

      notifications_bell:
        title: Notificações
        mark_all_as_read: Marcar todas como lidas
        default_title: Envio de formulário de contato
        time_ago: "há %{time}"
        empty: Nenhuma notificação nova
        view_all: Ver todas as notificações

      admin_bar:
        logged_in_as: "Conectado como:"
        inline_editing: Edição inline
        docs: Documentação
        help: Ajuda
        admin_dashboard: Painel admin
        sign_out: Sair
        loading_editor: Carregando editor...

  time:
    formats:
      lean_cms_datetime: "%-d de %B de %Y às %H:%M"

  datetime:
    distance_in_words:
      half_a_minute: meio minuto
      less_than_x_seconds:
        one: menos de 1 segundo
        other: menos de %{count} segundos
      x_seconds:
        one: 1 segundo
        other: "%{count} segundos"
      less_than_x_minutes:
        one: menos de um minuto
        other: menos de %{count} minutos
      x_minutes:
        one: 1 minuto
        other: "%{count} minutos"
      about_x_hours:
        one: cerca de 1 hora
        other: cerca de %{count} horas
      x_days:
        one: 1 dia
        other: "%{count} dias"
      about_x_months:
        one: cerca de 1 mês
        other: cerca de %{count} meses
      x_months:
        one: 1 mês
        other: "%{count} meses"
      about_x_years:
        one: cerca de 1 ano
        other: cerca de %{count} anos
      over_x_years:
        one: mais de 1 ano
        other: mais de %{count} anos
      almost_x_years:
        one: quase 1 ano
        other: quase %{count} anos
